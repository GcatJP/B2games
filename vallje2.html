        { en: "theory", jp: "理論" },
        { en: "threat", jp: "脅威" },
        { en: "tolerance", jp: "寛容" },
        { en: "topic", jp: "話題" },
        { en: "tradition", jp: "伝統" },
        { en: "transport", jp: "輸送" },
        { en: "trend", jp: "傾向" },
        { en: "unemployment", jp: "失業" },
        { en: "value", jp: "価値" },
        { en: "variety", jp: "多様性" },
        { en: "version", jp: "バージョン" },
        { en: "violence", jp: "暴力" },
        { en: "vision", jp: "展望" },
        { en: "volume", jp: "量" },
        { en: "wealth", jp: "富" },
        { en: "weight", jp: "重さ" },
        { en: "welfare", jp: "福祉" },
      ];

      let QUESTIONS_PER_GAME = 20; // now variable, set by start-screen buttons

      let questions = [];
      let currentIndex = 0;
      let score = 0;
      let wrongAnswers = [];

      const startWrapper = document.getElementById("startWrapper");
      const gameWrapper = document.getElementById("gameWrapper");
      const resultsWrapper = document.getElementById("resultsWrapper");
      const questionJpEl = document.getElementById("questionJp");
      const answersEl = document.getElementById("answers");
      const progressEl = document.getElementById("progress");
      const scoreEl = document.getElementById("score");
      const scoreSubEl = document.getElementById("scoreSub");
      const mistakesTitleEl = document.getElementById("mistakesTitle");
      const mistakesListEl = document.getElementById("mistakesList");
      const playAgainBtn = document.getElementById("playAgainBtn");

      function shuffle(array) {
        const arr = array.slice();
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }
      function buildQuestionBank() {
        const nouns = shuffle(NOUN_BANK)
          .slice(0, 100)
          .map((item) => ({ ...item, type: "noun" }));

        const adjectives = shuffle(ADJ_BANK)
          .slice(0, Math.min(100, ADJ_BANK.length))
          .map((item) => ({ ...item, type: "adjective" }));

        const verbs = shuffle(VERB_BANK)
          .slice(0, 100)
          .map((item) => ({ ...item, type: "verb" }));

        return shuffle([...nouns, ...adjectives, ...verbs]);
      }

      function startGame() {
        QUESTIONS_BANK = buildQuestionBank();
        questions = shuffle(QUESTIONS_BANK).slice(0, QUESTIONS_PER_GAME);
        currentIndex = 0;
        score = 0;
        wrongAnswers = [];
        startWrapper.style.display = "none";
        resultsWrapper.style.display = "none";
        gameWrapper.style.display = "flex";
        progressEl.style.display = "block";
        renderQuestion();
      }

      function renderQuestion() {
        const q = questions[currentIndex];
        progressEl.textContent =
          "Question " + (currentIndex + 1) + " / " + QUESTIONS_PER_GAME;
        questionJpEl.textContent = q.jp; // show the JAPANESE word as the question

        const distractorPool = QUESTIONS_BANK.filter(
          (v) => v.en !== q.en && v.type === q.type,
        );
        const distractors = [];
        const usedEn = new Set([q.en]);
        for (const word of shuffle(distractorPool)) {
          if (distractors.length >= 2) break;
          if (!usedEn.has(word.en)) {
            distractors.push(word);
            usedEn.add(word.en);
          }
        }
        const options = shuffle([q, ...distractors]);

        answersEl.innerHTML = "";
        options.forEach((opt) => {
          const btn = document.createElement("button");
          btn.className = "btn";
          btn.textContent = opt.en; // buttons show ENGLISH choices
          btn.addEventListener("click", () => handleAnswer(opt, q, btn));
          answersEl.appendChild(btn);
        });
      }

      function handleAnswer(selected, correctQ, clickedBtn) {
        const allBtns = answersEl.querySelectorAll(".btn");
        allBtns.forEach((b) => (b.disabled = true));

        const isCorrect = selected.en === correctQ.en;

        allBtns.forEach((b) => {
          if (b.textContent === correctQ.en) {
            // now correctly matches English button text
            b.classList.add("correct");
          } else if (b === clickedBtn) {
            b.classList.add("wrong");
          } else {
            b.classList.add("dim");
          }
        });

        if (isCorrect) {
          score++;
        } else {
          wrongAnswers.push({
            jp: correctQ.jp,
            correct: correctQ.en,
            chosen: selected.en,
          });
        }

        setTimeout(() => {
          currentIndex++;
          if (currentIndex < questions.length) {
            renderQuestion();
          } else {
            showResults();
          }
        }, 900);
      }
      function showResults() {
        gameWrapper.style.display = "none";
        progressEl.style.display = "none";
        resultsWrapper.style.display = "flex";

        scoreEl.textContent = score + " / " + QUESTIONS_PER_GAME;
        if (score === QUESTIONS_PER_GAME) {
          scoreSubEl.textContent = "Perfect score! 🎉";
        } else if (score >= QUESTIONS_PER_GAME * 0.7) {
          scoreSubEl.textContent = "Great job!";
        } else {
          scoreSubEl.textContent = "Keep practising!";
        }

        mistakesListEl.innerHTML = "";
        if (wrongAnswers.length > 0) {
          mistakesTitleEl.style.display = "block";
          wrongAnswers.forEach((w) => {
            const li = document.createElement("li");
            const jpSpan = document.createElement("span");
            jpSpan.className = "jp";
            jpSpan.textContent = w.jp;
            const enSpan = document.createElement("span");
            enSpan.className = "en";
            enSpan.textContent = w.correct;
            li.appendChild(jpSpan);
            li.appendChild(enSpan);
            mistakesListEl.appendChild(li);
          });
        } else {
          mistakesTitleEl.style.display = "none";
        }
      }

      // start-screen buttons pick the question count and begin the game
      document.querySelectorAll(".start-buttons .btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          QUESTIONS_PER_GAME = parseInt(btn.dataset.count, 10);
          startGame();
        });
      });

      // play again re-shows the start screen so a new count can be picked
      playAgainBtn.addEventListener("click", () => {
        resultsWrapper.style.display = "none";
        startWrapper.style.display = "flex";
      });
    </script>
  </body>
</html>
