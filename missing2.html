<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0,
          maximum-scale=1.0, user-scalable=no"
    />

    <!-- iOS Home Screen behaviour -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Missing Word" />

    <title>Missing Word Grammar Quiz</title>

    <link rel="preconnect" href="https://fonts.googleapis.com/" />
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      :root {
        --font-chalk:
          "Chalkboard SE", "Comic Sans MS", "Segoe Print", sans-serif;
        --colour-btn-face: grey;
        --colour-btn-active: grey;
        --colour-btn-border: #000000;
        --colour-heading-text: orange;
        --colour-correct: #4caf50;
        --colour-wrong: #e53935;
        --colour-dim: #f0f0f0;
        --colour-option-btn: #fff3d6;
      }

      .rotate-message {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 100;
        background: #0d1b33;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2em;
      }
      .rotate-message p {
        color: var(--colour-heading-text);
        -webkit-text-stroke: 0.8px darkorange;
        font-family: var(--font-chalk);
        font-weight: bold;
        font-size: clamp(1.2rem, 6vw, 2rem);
        line-height: 1.4;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        max-width: 100vw;
      }

      body {
        font-family: var(--font-chalk);
        background-color: #14213d;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        transition: background 0.3s ease;
      }

      h1 {
        font-family: var(--font-chalk);
        color: var(--colour-heading-text);
        width: 100%;
        text-align: center;
        letter-spacing: 0.03em;
        flex-shrink: 0;
        -webkit-text-stroke: 2px yellow;
        font-size: clamp(1.4rem, 7vw, 3rem);
        padding: 0.4em 0.5em 0.2em;
        margin-top: max(16px, env(safe-area-inset-top, 16px));
      }

      .back-btn {
        position: fixed;
        top: max(16px, env(safe-area-inset-top, 16px));
        left: max(16px, env(safe-area-inset-left, 16px));
        z-index: 60;
        display: flex;
        align-items: center;
        gap: 0.3em;
        background: var(--colour-btn-face);
        color: var(--colour-btn-border);
        border: 2px solid var(--colour-btn-border);
        border-radius: 999px;
        padding: 0.4em 0.9em;
        font-family: var(--font-chalk);
        font-weight: bold;
        font-size: 1rem;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.1s ease;
      }
      .back-btn:active {
        transform: translateY(2px);
        background: var(--colour-btn-active);
      }

      .progress {
        color: white;
        -webkit-text-stroke: 1px darkorange;
        font-weight: bold;
        font-size: clamp(0.9rem, 4vw, 1.3rem);
        text-align: center;
        margin-bottom: 0.5em;
        flex-shrink: 0;
      }

      /* START SCREEN */
      .start-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3vh;
        width: 100%;
        padding: 2vh 6vw;
      }

      .start-title {
        color: white;
        -webkit-text-stroke: 1px darkorange;
        font-size: clamp(1.2rem, 5.5vw, 1.9rem);
        text-align: center;
      }

      .start-sub {
        color: white;
        opacity: 0.9;
        font-size: clamp(0.85rem, 3.6vw, 1.1rem);
        text-align: center;
        max-width: 420px;
      }

      .start-buttons {
        display: flex;
        flex-direction: column;
        gap: clamp(14px, 4vw, 22px);
        width: 100%;
        max-width: 340px;
      }

      .start-buttons .btn {
        font-family: var(--font-chalk);
        font-weight: bold;
        color: #333;
        background: var(--colour-btn-face);
        border: 2px solid var(--colour-btn-border);
        border-radius: 10px;
        cursor: pointer;
        height: clamp(56px, 11vh, 90px);
        font-size: clamp(1.2rem, 6vw, 2rem);
        transition:
          transform 0.1s ease,
          background 0.15s ease;
      }
      .start-buttons .btn:active {
        transform: scale(0.97);
        background: var(--colour-btn-active);
      }

      .game-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 0;
        padding: 2vh 6vw 4vh;
      }

      .question-card {
        background: white;
        border: 3px solid var(--colour-btn-border);
        border-radius: 20px;
        padding: 1.2em 1.2em;
        margin-bottom: 3vh;
        text-align: center;
        width: 100%;
        max-width: 560px;
      }
      .question-label {
        font-family: var(--font-chalk);
        font-size: clamp(0.75rem, 3vw, 0.95rem);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #999;
        margin-bottom: 0.5em;
      }
      .question-sentence {
        font-size: clamp(1.15rem, 5.4vw, 1.9rem);
        color: #222;
        font-family: var(--font-chalk);
        line-height: 1.5;
      }
      .question-sentence .blank {
        display: inline-block;
        min-width: 2.4em;
        border-bottom: 3px solid #333;
        margin: 0 0.1em;
      }

      .options {
        display: flex;
        flex-direction: column;
        gap: clamp(10px, 3vw, 16px);
        width: 100%;
        max-width: 480px;
      }

      .btn {
        font-family: var(--font-chalk);
        font-weight: bold;
        color: #333;
        background: var(--colour-option-btn);
        border: 2px solid var(--colour-btn-border);
        border-radius: 10px;
        text-decoration: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        transition:
          transform 0.1s ease,
          background 0.15s ease;
        font-size: clamp(1rem, 5vw, 1.5rem);
        min-height: clamp(52px, 9vh, 76px);
        padding: 0.3em 0.8em;
        text-align: center;
      }
      .btn:active {
        transform: scale(0.97);
      }

      .btn.correct {
        background: var(--colour-correct);
        color: white;
      }

      .btn.wrong {
        background: var(--colour-wrong);
        color: white;
      }

      .btn.dim {
        background: var(--colour-dim);
        color: #999;
      }

      .btn:disabled {
        cursor: default;
      }

      /* RESULTS SCREEN */
      .results-wrapper {
        display: none;
        flex: 1;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        width: 100%;
        min-height: 0;
        padding: 2vh 6vw 4vh;
        overflow-y: auto;
      }

      .score {
        color: white;
        -webkit-text-stroke: 1.5px darkorange;
        font-size: clamp(2rem, 10vw, 4rem);
        text-align: center;
        margin-bottom: 0.3em;
      }

      .score-sub {
        color: white;
        -webkit-text-stroke: 1px darkorange;
        font-size: clamp(1rem, 5vw, 1.6rem);
        text-align: center;
        margin-bottom: 1em;
      }

      .mistakes-title {
        color: white;
        -webkit-text-stroke: 1px darkorange;
        font-size: clamp(1.1rem, 5vw, 1.8rem);
        text-align: center;
        margin-bottom: 0.6em;
      }

      .mistakes-list {
        list-style: none;
        width: 100%;
        max-width: 560px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 2em;
      }

      .mistakes-list li {
        background: white;
        border: 2px solid var(--colour-btn-border);
        border-radius: 12px;
        padding: 0.7em 1em;
        font-family: var(--font-chalk);
        color: #333;
        display: flex;
        flex-direction: column;
        gap: 0.3em;
        font-size: clamp(0.9rem, 3.6vw, 1.15rem);
      }

      .mistakes-list .sentence {
        font-weight: bold;
      }

      .mistakes-list .verdict {
        color: var(--colour-correct);
        font-weight: bold;
      }
      .mistakes-list .your-answer {
        color: var(--colour-wrong);
      }

      .play-again {
        font-family: var(--font-chalk);
        font-weight: bold;
        color: #333;
        background: var(--colour-btn-face);
        border: 2px solid var(--colour-btn-border);
        border-radius: 10px;
        cursor: pointer;
        padding: 0.7em 1.6em;
        font-size: clamp(1.1rem, 5vw, 1.6rem);
        transition: transform 0.1s ease;
      }
      .play-again:active {
        transform: scale(0.97);
        background: var(--colour-btn-active);
      }

      /* LANDSCAPE IPHONE - ask to rotate */
      @media screen and (orientation: landscape) and (max-height: 450px) {
        .rotate-message {
          display: flex;
        }
        h1,
        .progress,
        .start-wrapper,
        .game-wrapper,
        .results-wrapper,
        .back-btn {
          display: none;
        }
      }

      /* PORTRAIT IPHONE tweaks */
      @media screen and (orientation: portrait) and (max-width: 430px) {
        h1 {
          font-size: clamp(1.2rem, 8vw, 2.1rem) !important;
          margin-top: max(50px, env(safe-area-inset-top, 50px)) !important;
        }
        .game-wrapper {
          padding: 1vh 6vw 3vh;
        }
        .question-card {
          margin-bottom: 2.5vh;
        }
      }
    </style>
  </head>

  <body>
    <div class="rotate-message">
      <p>🔄 Please rotate your device to portrait mode!</p>
    </div>

    <a class="back-btn" href="grammar2.html">← Back</a>
    <h1>Missing Word</h1>
    <div class="progress" id="progress" style="display: none">
      Question 1 / 20
    </div>

    <div class="start-wrapper" id="startWrapper">
      <div class="start-title">Missing Word Quiz</div>
      <div class="start-sub">
        Read each sentence. Choose the correct word to fill the blank.
      </div>
      <div class="start-buttons">
        <button class="btn" data-count="10">10</button>
        <button class="btn" data-count="20">20</button>
        <button class="btn" data-count="30">30</button>
      </div>
    </div>

    <div class="game-wrapper" id="gameWrapper" style="display: none">
      <div class="question-card">
        <div class="question-label">Choose the correct word</div>
        <div class="question-sentence" id="questionSentence"></div>
      </div>
      <div class="options" id="options"></div>
    </div>

    <div class="results-wrapper" id="resultsWrapper" style="display: none">
      <div class="score" id="score"></div>
      <div class="score-sub" id="scoreSub"></div>
      <div class="mistakes-title" id="mistakesTitle" style="display: none">
        Sentences to review
      </div>
      <ul class="mistakes-list" id="mistakesList"></ul>
      <button class="play-again" id="playAgainBtn">Play Again</button>
    </div>

    <script>
      // ---- Missing Word bank: 250 questions based on A2 Grammar List ----
      const MISSING_WORD_BANK = [

        {

        },
        {

        },
        {

          answer: "completed",
        },
        {
          text: "We ___ this article twice already.",
          options: ["read", "have read", "are reading"],
          answer: "have read",
        },

        // 2. Present perfect continuous
        {
          text: "I ___ for two hours.",
          options: ["study", "have been studying", "studied"],
          answer: "have been studying",

        {
          text: "She ___ all morning.",
          options: ["has been cooking", "cooked", "cooks"],
          answer: "has been cooking",
        },
        {
          text: "They ___ since seven o'clock.",
          options: ["have been waiting", "waited", "wait"],
          answer: "have been waiting",
        },
        {
          text: "How long ___ you been learning English?",
          options: ["have", "has", "did"],
          answer: "have",
        },
        {
          text: "He looks tired because he ___ all day.",
          options: ["has been working", "worked", "works"],
          answer: "has been working",
        },
        {
          text: "We ___ about this problem for weeks.",

        {
          text: "She ___ finished her homework before dinner.",

        {

        },
        {

          options: ["has", "had", "was"],
          answer: "had",
        },
        {
          text: "I ___ never seen snow before that winter.",
          options: ["have", "had", "was"],
          answer: "had",
        },
        {
          text: "They ___ eaten by the time we arrived.",
          options: ["have", "had", "has"],

        },
        {

          options: ["have", "had", "are"],

        {
          text: "I wondered why she ___ not called.",
          options: ["has", "had", "was"],
          answer: "had",
        },

        // 4. Second conditional
        {
          text: "If I ___ more money, I would travel more.",
          options: ["have", "had", "will have"],

        },
        {
          text: "If she ___ here, she would help us.",

        {

        {

          options: ["is", "was", "has been"],

          answer: "Only then",
        },
        {
          text: "___ was the film boring, but it was also too long.",
          options: ["Not only", "Never", "Rarely"],
          answer: "Not only",
        },
        {
          text: "___ have I been so disappointed.",
          options: ["Rarely", "No sooner", "Only then"],
          answer: "Rarely",
        },
        {
          text: "___ did we understand the seriousness of the situation.",
          options: ["Only later", "Not only", "No sooner"],
          answer: "Only later",
        },
        {
          text: "___ under any circumstances should you share your password.",
          options: ["Not", "Never", "No sooner"],
          answer: "Never",
        },
        {
          text: "___ he finished speaking than the audience began to applaud.",
          options: ["No sooner had", "Not only had", "Never had"],
          answer: "No sooner had",
        },
        {
          text: "___ does she complain about her workload.",
          options: ["Rarely", "Not only", "No sooner"],
          answer: "Rarely",
        },
        {
          text: "___ was the traffic bad, but the trains were also delayed.",
          options: ["Not only", "Never", "Rarely"],
          answer: "Not only",
        },
      ];
      let questions = [];
      let currentIndex = 0;
      let score = 0;
      let wrongAnswers = [];

      const startWrapper = document.getElementById("startWrapper");
      const gameWrapper = document.getElementById("gameWrapper");
      const resultsWrapper = document.getElementById("resultsWrapper");
      const questionSentenceEl = document.getElementById("questionSentence");
      const optionsEl = document.getElementById("options");
      const progressEl = document.getElementById("progress");
      const scoreEl = document.getElementById("score");
      const scoreSubEl = document.getElementById("scoreSub");
      const mistakesTitleEl = document.getElementById("mistakesTitle");
      const mistakesListEl = document.getElementById("mistakesList");
      const playAgainBtn = document.getElementById("playAgainBtn");

      function shuffle(array) {
        const arr = array.slice();
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function startGame() {
        questions = shuffle(MISSING_WORD_BANK).slice(0, QUESTIONS_PER_GAME);
        currentIndex = 0;
        score = 0;
        wrongAnswers = [];
        startWrapper.style.display = "none";
        resultsWrapper.style.display = "none";
        gameWrapper.style.display = "flex";
        progressEl.style.display = "block";
        renderQuestion();
      }

      function renderQuestion() {
        const q = questions[currentIndex];
        progressEl.textContent =
          "Question " + (currentIndex + 1) + " / " + QUESTIONS_PER_GAME;

        questionSentenceEl.innerHTML = q.text.replace(
          "___",
          '<span class="blank">&nbsp;</span>',
        );

        optionsEl.innerHTML = "";
        const shuffledOptions = shuffle(q.options);
        shuffledOptions.forEach((opt) => {
          const btn = document.createElement("button");
          btn.className = "btn";
          btn.textContent = opt;
          btn.addEventListener("click", () => handleAnswer(opt, btn));
          optionsEl.appendChild(btn);
        });
      }

      function handleAnswer(chosen, chosenBtn) {
        const q = questions[currentIndex];
        const allBtns = optionsEl.querySelectorAll(".btn");
        allBtns.forEach((b) => (b.disabled = true));

        const isCorrectAnswer = chosen === q.answer;

        allBtns.forEach((b) => {
          if (b.textContent === q.answer) {
            b.classList.add("correct");
          } else if (b === chosenBtn) {
            b.classList.add("wrong");
          } else {
            b.classList.add("dim");
          }
        });

        if (isCorrectAnswer) {
          score++;
        } else {
          wrongAnswers.push({
            text: q.text,
            answer: q.answer,
            chosen: chosen,
          });
        }

        setTimeout(() => {
          currentIndex++;
          if (currentIndex < questions.length) {
            renderQuestion();
          } else {
            showResults();
          }
        }, 900);
      }

      function showResults() {
        gameWrapper.style.display = "none";
        progressEl.style.display = "none";
        resultsWrapper.style.display = "flex";

        scoreEl.textContent = score + " / " + QUESTIONS_PER_GAME;
        if (score === QUESTIONS_PER_GAME) {
          scoreSubEl.textContent = "Perfect score! 🎉";
        } else if (score >= QUESTIONS_PER_GAME * 0.7) {
          scoreSubEl.textContent = "Great job!";
        } else {
          scoreSubEl.textContent = "Keep practising!";
        }

        mistakesListEl.innerHTML = "";
        if (wrongAnswers.length > 0) {
          mistakesTitleEl.style.display = "block";
          wrongAnswers.forEach((w) => {
            const li = document.createElement("li");
            const sentSpan = document.createElement("span");
            sentSpan.className = "sentence";
            sentSpan.textContent = w.text.replace("___", "_____");
            const yourSpan = document.createElement("span");
            yourSpan.className = "your-answer";
            yourSpan.textContent = "You chose: " + w.chosen;
            const verdictSpan = document.createElement("span");
            verdictSpan.className = "verdict";
            verdictSpan.textContent = "Correct answer: " + w.answer;
            li.appendChild(sentSpan);
            li.appendChild(yourSpan);
            li.appendChild(verdictSpan);
            mistakesListEl.appendChild(li);
          });
        } else {
          mistakesTitleEl.style.display = "none";
        }
      }

      // start-screen buttons pick the question count and begin the game
      document.querySelectorAll(".start-buttons .btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          QUESTIONS_PER_GAME = parseInt(btn.dataset.count, 10);
          startGame();
        });
      });

      // play again re-shows the start screen so a new count can be picked
      playAgainBtn.addEventListener("click", () => {
        resultsWrapper.style.display = "none";
        startWrapper.style.display = "flex";
      });
    </script>
  </body>
</html>
